[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    "build",
    "dist",
    "migrations",
    "alembic",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
    "TID",  # flake8-tidy-imports
    "G",    # flake8-logging-format: %s templates, never f-strings (the Bugsnag grouping key)
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in argument defaults
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random.choices".msg = "Use secrets.choice for security-sensitive randomness"
"random.choice".msg = "Use secrets.choice for security-sensitive randomness"
"random.randint".msg = "Use secrets.randbelow for security-sensitive randomness"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
# Runtime is 3.13 (Dockerfile); 3.12 is the oldest interpreter in use (local
# venv). Deprecated 3.0.0 (via slowapi → limits) uses the 3.12 `type` statement,
# so a lower target fails type-checking inside site-packages (CI 2026-09-27).
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true

# Per-module options
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

# SQLAlchemy models have known type issues with mypy
[[tool.mypy.overrides]]
module = [
    "app.models.*",
    "app.crud.*",
    "app.db.*"
]
disable_error_code = [
    "assignment",
    "arg-type",
    "return-value",
    "attr-defined",
    "var-annotated",
    "call-arg"
]

# Services and API endpoints that interact with SQLAlchemy
[[tool.mypy.overrides]]
module = [
    "app.services.otp",
    "app.services.notifications",
    "app.services.expo_notifications",
    "app.services.notification_helpers",
    "app.api.v1.endpoints.*",
    "app.background.tasks"
]
disable_error_code = [
    "assignment",
    "arg-type",
    "attr-defined",
    "var-annotated",
    "call-arg"
]
