<div id="auth-form" class="fade-in">
    <div style="text-align: center; margin-bottom: 24px;">
        <div class="success-icon" style="width: 48px; height: 48px; margin-bottom: 12px;">
            <svg fill="none" viewBox="0 0 24 24" style="width: 24px; height: 24px; stroke: white; stroke-width: 3;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        <p style="font-weight: 600; color: #2C3E50;">Identity verified</p>
    </div>

    <form action="/sponsorships/{{ share_code }}/checkout" method="post">
        <input type="hidden" name="gifter_phone" value="{{ gifter_phone }}">

        <div style="margin-bottom: 24px;">
            <p style="font-size: 14px; font-weight: 600; color: #2C3E50; margin-bottom: 12px;">Choose a Plan</p>
            <div style="display: flex; gap: 12px;">
                <label style="flex: 1; cursor: pointer;">
                    <input type="radio" name="plan_type" value="monthly" checked style="display: none;"
                           onchange="selectSponsorshipPlan(this)">
                    <div class="plan-card" id="sponsorship-plan-monthly"
                         style="border: 2px solid #14B8A6; border-radius: 12px; padding: 16px; text-align: center;">
                        <div style="font-size: 22px; font-weight: 700; color: #2C3E50;">$5</div>
                        <div style="font-size: 13px; color: #7F8C8D;">per month</div>
                    </div>
                </label>
                <label style="flex: 1; cursor: pointer;">
                    <input type="radio" name="plan_type" value="annual" style="display: none;"
                           onchange="selectSponsorshipPlan(this)">
                    <div class="plan-card" id="sponsorship-plan-annual"
                         style="border: 2px solid #E5E7EB; border-radius: 12px; padding: 16px; text-align: center; position: relative;">
                        <div style="position: absolute; top: -10px; right: -10px; background: linear-gradient(135deg, #14B8A6, #0D9488); color: white; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 100px;">BEST VALUE</div>
                        <div style="font-size: 22px; font-weight: 700; color: #2C3E50;">$48</div>
                        <div style="font-size: 13px; color: #7F8C8D;">per year ($4/mo)</div>
                    </div>
                </label>
            </div>
        </div>

        <button type="submit"
                style="width: 100%; padding: 16px; background: linear-gradient(135deg, #14B8A6 0%, #0D9488 100%); color: white; border: none; border-radius: 100px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(20, 184, 166, 0.35);">
            Proceed to Payment
        </button>
    </form>
</div>

<script>
function selectSponsorshipPlan(radio) {
    document.querySelectorAll('.plan-card').forEach(function(card) {
        card.style.borderColor = '#E5E7EB';
    });
    radio.parentElement.querySelector('.plan-card').style.borderColor = '#14B8A6';
}
</script>
