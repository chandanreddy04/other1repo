<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Made It Home{% endblock title %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Design System Colors */
            --primary: #14B8A6;
            --primary-dark: #0D9488;
            --primary-light: rgba(20, 184, 166, 0.1);
            --danger: #EF4444;
            --warning: #FFE066;
            --success: #6366F1;
            --info: #3B82F6;
            --secondary: #A78BFA;
            --secondary-dark: #8B5CF6;
            --dark: #2C3E50;
            --gray: #7F8C8D;
            --light-gray: #ECF0F1;
            --white: #FFFFFF;

            /* Gradients */
            --gradient-primary: linear-gradient(135deg, #14B8A6 0%, #0D9488 100%);
            --gradient-bg: linear-gradient(135deg, #F8FAFB 0%, #E6F4F1 100%);

            /* Shadows */
            --shadow-sm: 0 2px 10px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.12);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.15);
            --shadow-primary: 0 4px 15px rgba(20, 184, 166, 0.35);

            /* Border Radius */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 100px;

            /* Spacing */
            --spacing-xs: 8px;
            --spacing-sm: 12px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--gradient-bg);
            min-height: 100vh;
            color: var(--dark);
            line-height: 1.6;
        }

        /* Container */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .container-wide {
            max-width: 1000px;
        }

        /* Navigation Bar */
        .nav-bar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(20, 184, 166, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: var(--spacing-md) var(--spacing-lg);
        }

        .nav-content {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            gap: var(--spacing-lg);
            align-items: center;
        }

        .nav-link {
            color: var(--dark);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: var(--primary);
        }

        .nav-link.active {
            color: var(--primary);
            position: relative;
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary);
        }

        .nav-login-btn {
            padding: 8px 20px;
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: var(--radius-full);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .nav-login-btn:hover {
            background: var(--primary);
            color: white;
        }

        @media (max-width: 768px) {
            .nav-logo-text { display: none; }
        }

        /* Cards - Mobile First */
        .card {
            background: white;
            border: 1px solid rgba(20, 184, 166, 0.2);
            border-radius: var(--radius-xl);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
            margin-bottom: var(--spacing-md);
        }

        .card:active {
            transform: scale(0.98);
            box-shadow: var(--shadow-sm);
        }

        @media (hover: hover) {
            .card:hover {
                transform: translateY(-2px);
                box-shadow: var(--shadow-lg);
                border-color: rgba(20, 184, 166, 0.4);
            }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--spacing-md);
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
        }

        .card-subtitle {
            font-size: 14px;
            color: var(--gray);
            margin-top: 4px;
        }

        .card-body {
            color: var(--gray);
        }

        /* Buttons */
        .btn {
            padding: 16px 36px;
            border: none;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
            box-shadow: var(--shadow-primary);
        }

        .btn-primary:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(20, 184, 166, 0.35);
        }

        @media (hover: hover) {
            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(20, 184, 166, 0.45);
            }
        }

        .btn-secondary {
            background: linear-gradient(135deg, #A78BFA 0%, #8B5CF6 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(167, 139, 250, 0.35);
        }

        .btn-danger {
            background: linear-gradient(135deg, #FFE066 0%, #FFD43B 100%);
            color: #2C3E50;
            box-shadow: 0 4px 15px rgba(255, 224, 102, 0.35);
            font-weight: 700;
        }

        .btn-success {
            background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
        }

        .btn-sm {
            padding: 10px 20px;
            font-size: 14px;
        }

        .btn-block {
            width: 100%;
        }

        .btn:disabled, .btn.htmx-request {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Forms */
        .form-group {
            margin-bottom: var(--spacing-lg);
        }

        .form-label {
            display: block;
            margin-bottom: var(--spacing-xs);
            color: var(--dark);
            font-weight: 600;
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 16px 24px;
            border: 3px solid var(--primary);
            border-radius: 50px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            background: white;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--secondary);
            transform: scale(1.02);
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.1);
        }

        .form-input.error {
            border-color: var(--danger);
        }

        .form-hint {
            margin-top: var(--spacing-xs);
            font-size: 14px;
            color: var(--gray);
        }

        .form-error {
            margin-top: var(--spacing-xs);
            font-size: 14px;
            color: var(--danger);
        }

        /* OTP Input */
        .otp-input-group {
            display: flex;
            gap: var(--spacing-sm);
            justify-content: center;
            margin: var(--spacing-xl) 0;
        }

        .otp-input {
            width: 50px;
            height: 56px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            border: 2px solid var(--light-gray);
            border-radius: var(--radius-md);
            transition: all 0.2s;
        }

        .otp-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        /* Alerts & Status */
        .alert {
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-md);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: rgba(99, 102, 241, 0.15);
            color: #4F46E5;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            color: #991B1B;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .alert-warning {
            background: rgba(255, 224, 102, 0.15);
            color: #E5A000;
            border: 1px solid rgba(255, 224, 102, 0.3);
        }

        .alert-info {
            background: rgba(59, 130, 246, 0.1);
            color: #1E3A8A;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        /* Status Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-pending {
            background: rgba(255, 224, 102, 0.15);
            color: #E5A000;
            border: 1px solid rgba(255, 224, 102, 0.3);
        }

        .badge-active {
            background: rgba(20, 184, 166, 0.15);
            color: #0D9488;
            border: 1px solid rgba(20, 184, 166, 0.3);
        }

        .badge-emergency {
            background: rgba(239, 68, 68, 0.1);
            color: #991B1B;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        /* Empty States */
        .empty-state {
            text-align: center;
            padding: var(--spacing-xl) var(--spacing-lg);
            color: var(--gray);
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto var(--spacing-lg);
            opacity: 0.3;
        }

        .empty-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: var(--spacing-sm);
        }

        .empty-description {
            color: var(--gray);
            margin-bottom: var(--spacing-xl);
        }

        /* Loading States */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(20, 184, 166, 0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Utilities */
        .text-center { text-align: center; }
        .text-primary { color: var(--primary); }
        .text-danger { color: var(--danger); }
        .text-muted { color: var(--gray); }
        .font-bold { font-weight: 700; }
        .mt-sm { margin-top: var(--spacing-sm); }
        .mt-md { margin-top: var(--spacing-md); }
        .mt-lg { margin-top: var(--spacing-lg); }
        .mt-xl { margin-top: var(--spacing-xl); }
        .mb-sm { margin-bottom: var(--spacing-sm); }
        .mb-md { margin-bottom: var(--spacing-md); }
        .mb-lg { margin-bottom: var(--spacing-lg); }
        .mb-xl { margin-bottom: var(--spacing-xl); }

        /* Mobile Responsiveness */
        @media (max-width: 640px) {
            .container {
                padding: 16px;
            }

            .nav-links {
                gap: var(--spacing-md);
            }

            .card {
                padding: var(--spacing-md);
            }

            .btn {
                padding: 14px 24px;
                font-size: 15px;
            }
        }

        /* HTMX Loading Indicators */
        .htmx-indicator {
            display: none;
        }

        .htmx-request .htmx-indicator {
            display: inline-block;
        }

        .htmx-settling {
            opacity: 0.6;
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .slide-up {
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    {% block extra_css %}{% endblock extra_css %}
</head>
<body>
    {% block body %}
    <div class="container">
        {% block content %}{% endblock content %}
    </div>
    {% endblock body %}

    {% block footer %}{% include "fragments/footer.html" %}{% endblock footer %}

    {% block extra_js %}{% endblock extra_js %}
</body>
</html>
